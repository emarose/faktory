Tier 1: Basic Machines

-Furnace (Cost: Iron Ore, Copper Ore, Coal)
Processes:
Iron Ore + Coal → Iron Ingot
Copper Ore + Coal → Copper Ingot

-Assembler (Cost: Iron Ingot, Copper Ingot)
Processes:
Iron Ingot + Copper Ingot → Circuits

-Biomass extractor (Cost: Circuits, Iron Ingot, Copper Ingot)
Processes: none
Effects: Allows the extraction of biomass



-------------------------------------------------
Once the player has built the Biomass extractor, Biomass gets added to resource extractor
the player can now craft Basic Bio-Components & Organic Fuel in the Bio-Processor and Steel in the Steel Smelter

//Milestone 1: Build the Biomass extractor
//Reward: Unlocks TIER 2 - Bio production and Steel

Tier 2: Initial Bio processing

-Steel Smelter (Cost: Iron Ingot, Coal, Circuits)
Processes:
Iron Ingot + Coal + Copper Ingot → Steel Ingot

-Advanced Furnace (Cost: Circuits, Steel Ingot, *Furnace)
Processes: none (upgrade)
Effects:
Iron Ingot processing time 1/2 / Copper Ingot processing time 1/2

- Processor (Cost: Circuits, Steel Ingot, *Assembler)
Processes: none (upgrade)
Effects:
Circuits processing time 1/2

-Bio-Processor (Cost: Biomass, Circuits, Steel Ingot, *Processor)
Processes:
Biomass + Steel Ingot → Basic Bio-components
Biomass → Organic Fuel


-Coal Generator (Cost: Circuits, Iron Ingot, Coal)
Processes: coal -> Energy
Effects: Generates energy per coal unit added 

-------------------------------------------------
Once the player has built the Bio-Processor, he can start crafting advanced products and start the Bio integration

//Milestone 2: Build the Bio-Processor
//Reward: Unlocks TIER 3 - Bio-Furnace and advanced processing

Tier 3: Intermediate Bio processing

-Synthesizer (Circuits, Basic Bio-components, Steel Ingot)
Processes:
Circuits + Basic Bio-components + Organic Fuel → Bio-Circuits
Toxic Waste + Biomass -> Radioactive Mass
Radioactive Mass + Organic Fuel-> fusion fuel

- Automated Extractor (Cost: Bio-Circuits, *Biomass extractor)
Processes: none (upgrade)
Effects:
Automatically gather Copper Ore, Iron Ore, Coal and Biomass until 20 units of each is reached.

-Bio-Furnace (Cost:Steel, Bio-Circuits, *Advanced Furnace)
Processes:
Organic Fuel + Biomass + Iron Ingots → Bio-Iron
Organic Fuel + Biomass + Copper Ingots → Bio-Copper
Organic Fuel + Bio-Iron + Bio-Copper + Steel Ingot → Bio-Steel

-Bio Generator (Cost: Bio-Circuits, Steel Ingot, *Coal generator)
Processes: 
Biomass -> Energy
Biomass -> Toxic Waste
Effects: Generates energy per biomass unit added 
-----------------------------------------------------
Once the player has crafted the Bio-Furnace he can start integrating the Mech and Bio, and speed up previous gathering/production tasks

//Milestone 3: Build the Bio-Furnace
//Reward: Unlocks TIER 4 - Bio-Furnace and advanced processing

Tier 4: Advanced Machines

-Bio-Material Refinery (Cost: Bio-Steel, Bio-Circuits)
Processes:
Bio-Steel + Basic Bio-components + Bio-Circuits → Advanced Bio-components

-Mechanoid builder (Cost: Bio-Steel, Advanced Bio-components)
Processes:
Advanced Bio-components + Bio-Circuits + Organic Fuel → Bio-Mechanical Core
Advanced Bio-components + Bio-Mechanical Core + Bio-Steel  → Mech-Bio Unit

-Fuison Reactor(Cost: Bio-Steel, Advanced Bio-components, Bio-circuits, *Bio generator)
Processes:
Effects: Generates energy per fusion fuel unit added 


